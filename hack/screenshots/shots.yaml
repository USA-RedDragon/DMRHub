# The screenshots of the docs. hack/screenshots.sh makes each one, in this
# order, into doc/Screenshots. Each shot:
#   name   file name in doc/Screenshots
#   phase  setup (the setup wizard) or main (the demo network)
#   as     the user that is logged in: guest, n0call (the super admin),
#          n1call, n2call or n3call
#   needs  states of the demo network that the shot needs, made once, in
#          order (see hooks.go)
#   route  the page to open; none stays on the page of the shot before
#   wait   a text that the page must show
#   steps  what to do before the capture; after: what to do after it
#          fill <label or #id> = <text>, pick <label or #id> = <option>,
#          toggle <label or #id>, click <button text>, clicktest <data-test>,
#          clickcss <selector>, wait <text>, scroll <card title>, blur,
#          file <selector> = <file in the work directory>, goto <route>,
#          run <state>
#   clip   card <title>, dialog or css <selector>; none takes the window
#   frozen hold the clock still for the shot, for programs that ping on
#          their own schedule
#   pause  wait this long before the page opens, so that the plugins inside
#          DMRHub send a heartbeat on the clock of the shot
# The clock of DMRHub and of the browser starts at start, and moves on by
# a fixed time for each shot, call and position, so the same UI gives the
# same PNG files.
