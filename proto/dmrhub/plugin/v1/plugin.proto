syntax = "proto3";

package dmrhub.plugin.v1;

option go_package = "github.com/USA-RedDragon/DMRHub/sdk/plugin/v1;pluginv1";

// PluginService is how a plugin talks to the hub. A plugin answers the calls
// to the IDs an admin gave it, and sends calls only from those IDs.
service PluginService {
  // Connect opens the plugin's one stream. The plugin sends its token in the
  // "authorization" metadata as "Bearer <token>". The hub answers first with
  // a Welcome, then sends the bursts of the calls to the plugin's IDs. A newer
  // connection of the same plugin ends this one.
  rpc Connect(stream ConnectRequest) returns (stream ConnectResponse);
}

// ConnectRequest is what a plugin sends.
message ConnectRequest {
  oneof message {
    // A burst of a call that the plugin sends.
    Burst burst = 1;
    // What the plugin wants to hear about besides the calls to its IDs.
    Subscribe subscribe = 2;
    // A position that a radio reported to the plugin.
    Position position = 3;
    // Who the plugin is. A plugin that runs inside DMRHub sends it first,
    // before the hub sends the Welcome. A plugin that runs as its own
    // program may send it after the Welcome, so that the Plugins page shows
    // its version.
    Hello hello = 4;
    // A request on a network connection of a plugin that runs inside
    // DMRHub. The hub ignores it from a plugin that runs as its own
    // program, which reaches the network by itself.
    NetRequest net = 5;
    // A request that the hub answers with an Answer of the same id. The
    // hub ignores a request whose feature its Welcome does not list.
    Request request = 6;
  }
}

// Hello tells the hub who a plugin is, and what it asks for.
message Hello {
  // The name the Plugins page shows, at most 64 characters.
  string name = 1;
  // The version of the plugin, at most 32 characters.
  string version = 2;
  // Who wrote the plugin, at most 64 characters.
  string author = 3;
  // What the plugin does, in a sentence or two, at most 500 characters.
  string description = 4;
  // The IDs the plugin asks for. The admin gives it its IDs, starting from
  // these.
  repeated IDRange ids = 5;
  // The hosts a plugin that runs inside DMRHub asks to reach. It reaches
  // only those that an admin allows.
  repeated Host hosts = 6;
  // The switches that each user turns on or off for this plugin on the
  // Settings page, at most 4. A plugin serves a user only when that user
  // turned its switch on, such as for a service that sends the user's
  // messages to the internet.
  repeated Switch switches = 7;
}

// Switch is a per-user switch of a plugin, which the Settings page shows
// as a card with the title, the description, the switch, the details and
// the notice.
message Switch {
  // The key of the switch in Lookup and UserSwitch: 1 to 32 lowercase
  // letters, digits, "_" or "-", one per switch of the plugin.
  string key = 1;
  // The title of the card, at most 64 characters.
  string title = 2;
  // What the switch turns on, in a sentence, at most 300 characters.
  string description = 3;
  // A caution that the card shows under the details, such as who can read
  // what the service sends, at most 300 characters.
  string notice = 4;
  // Lines that the card shows while the switch is on, at most 4.
  repeated SwitchDetail details = 5;
  // A choice that the user makes besides on or off, such as the SSID of an
  // APRS address.
  SwitchChoice choice = 6;
}

// SwitchDetail is a line of the card of a switch: a label and a value. In
// the value, the hub replaces {callsign} with the user's callsign,
// {choice} with the user's choice and {id} with the first of the plugin's
// IDs, and the text between backticks shows in a fixed-width font.
message SwitchDetail {
  // At most 32 characters.
  string label = 1;
  // At most 200 characters.
  string value = 2;
}

// SwitchChoice is a choice that a user makes for a switch, from a list.
message SwitchChoice {
  // The label of the list, at most 32 characters.
  string label = 1;
  // The options, 1 to 32, each at most 16 characters.
  repeated string options = 2;
  // The option of a user who did not choose, one of options. Empty is the
  // first option.
  string preset = 3;
}

// Host is a host that a plugin asks to reach, and why.
message Host {
  // The host name or IP address and the TCP port, such as
  // "nets.example.org:443".
  string address = 1;
  // Why the plugin reaches it, in a sentence, at most 200 characters.
  string reason = 2;
}

// NetRequest is a request of a plugin that runs inside DMRHub on one of its
// TCP connections. The hub answers each with a NetResponse of the same
// connection and operation. A connection has at most one read and one
// write at a time.
message NetRequest {
  // The plugin's number of the connection. Open gives it to a new
  // connection.
  uint32 conn = 1;
  oneof op {
    // Open connects to a host that an admin allowed, as host:port.
    string open = 2;
    // Read asks for at most this many bytes, at most 16384.
    uint32 read = 3;
    // Write sends these bytes, at most 16384.
    bytes write = 4;
    // Close closes the connection.
    NetClose close = 5;
  }
}

// NetClose closes a connection.
message NetClose {}

// NetOp is the operation that a NetResponse answers.
enum NetOp {
  NET_OP_UNSPECIFIED = 0;
  NET_OP_OPEN = 1;
  NET_OP_READ = 2;
  NET_OP_WRITE = 3;
  NET_OP_CLOSE = 4;
}

// NetResponse answers a NetRequest.
message NetResponse {
  uint32 conn = 1;
  NetOp op = 2;
  // The bytes that a read got.
  bytes data = 3;
  // How many bytes a write sent.
  uint32 written = 4;
  // Why the operation failed, or empty when it worked.
  string error = 5;
  // The host closed its side: a read gets no more bytes.
  bool eof = 6;
}

// Subscribe asks the hub for more than the calls to the plugin's IDs. A
// later Subscribe replaces an earlier one.
message Subscribe {
  // Tracking asks for the radios whose owners turned position tracking on:
  // a Tracked with all of them, a Tracking at each change, and a Heard each
  // time one of them is heard on a repeater.
  bool tracking = 1;
  // Heard asks for a Heard each time the hub hears any radio on a
  // repeater, not only the radios with tracking on.
  bool heard = 2;
  // Texts asks for a Text for each text message to one of the plugin's
  // IDs, as the hub read it. The bursts of the message still come.
  bool texts = 3;
  // Switches asks for a UserSwitches with each user who turned a switch of
  // the plugin on, and a UserSwitch at each change.
  bool switches = 4;
  // The APRS addresses, as CALLSIGN-SSID, whose APRS messages the plugin
  // gets as an APRSMessage. The hub takes only the addresses whose
  // callsign is that of a user who turned a switch of the plugin on, and
  // drops an address when its user turns the switches off.
  repeated string aprs = 5;
}

// PositionFormat is how a radio reported a position.
enum PositionFormat {
  POSITION_FORMAT_UNSPECIFIED = 0;
  POSITION_FORMAT_LRRP = 1;
  POSITION_FORMAT_NMEA = 2;
  POSITION_FORMAT_HDAP = 3;
}

// Position is a position that a radio reported. The hub keeps it only when
// the radio's owner turned tracking on, and the radio sent it to one of the
// plugin's IDs.
message Position {
  // The radio that reported the position.
  uint32 radio = 1;
  // The plugin's ID that the radio sent the position to.
  uint32 service = 2;
  // The timeslot it came on, 1 or 2.
  uint32 slot = 3;
  PositionFormat format = 4;
  // Degrees, north and east positive.
  double latitude = 5;
  double longitude = 6;
  optional double accuracy_meters = 7;
  optional double speed_meters_per_second = 8;
  // Degrees clockwise from true north.
  optional double heading_degrees = 9;
  optional double altitude_meters = 10;
  // When the radio took the fix, in seconds since 1970 UTC.
  optional int64 fix_time = 11;
}

// ConnectResponse is what the hub sends.
message ConnectResponse {
  oneof message {
    // The first message: who the plugin is and its IDs.
    Welcome welcome = 1;
    // A burst of a call to one of the plugin's IDs.
    Burst burst = 2;
    // A burst of the plugin that the hub did not send, and why.
    Refusal refusal = 3;
    // The admin changed the plugin's IDs.
    Ranges ranges = 4;
    // All the radios with tracking on, after a Subscribe with tracking.
    Tracked tracked = 5;
    // An owner turned tracking of a radio on or off, or changed how often
    // it reports.
    Tracking tracking = 6;
    // A radio with tracking on was heard on a repeater, or any radio after a
    // Subscribe with heard.
    Heard heard = 7;
    // The hub stops soon.
    Draining draining = 8;
    // The answer to a NetRequest of a plugin that runs inside DMRHub.
    NetResponse net = 9;
    // The answer to a Request.
    Answer answer = 10;
    // A text message to one of the plugin's IDs, after a Subscribe with
    // texts.
    Text text = 11;
    // Each user who turned a switch of the plugin on, after a Subscribe
    // with switches.
    UserSwitches user_switches = 12;
    // A user turned a switch of the plugin on or off, or changed its
    // choice, after a Subscribe with switches.
    UserSwitch user_switch = 13;
    // An APRS message to one of the addresses that the plugin subscribed
    // to.
    APRSMessage aprs = 14;
  }
}

// Feature is a part of the protocol that a replica of the hub serves. A
// hub older than a feature leaves it out of its Welcome, and ignores the
// requests and subscriptions of that feature.
enum Feature {
  FEATURE_UNSPECIFIED = 0;
  // StoreGet, StorePut, StoreDelete and StoreList.
  FEATURE_STORE = 1;
  // Lookup.
  FEATURE_LOOKUP = 2;
  // RepeaterQuery.
  FEATURE_REPEATER = 3;
  // Subscribe with heard.
  FEATURE_HEARD = 4;
  // Subscribe with texts.
  FEATURE_TEXTS = 5;
  // SendText.
  FEATURE_SEND_TEXT = 6;
  // Hello with switches, and Subscribe with switches.
  FEATURE_SWITCHES = 7;
  // APRSSend.
  FEATURE_APRS = 8;
  // Subscribe with aprs.
  FEATURE_APRS_INBOX = 9;
  // SendEmail.
  FEATURE_EMAIL = 10;
  // PlayPrompt, and SendText with reply_to.
  FEATURE_PROMPT = 11;
}

// Request is a request of a plugin that the hub answers with an Answer.
message Request {
  // The plugin's number of the request, which the Answer carries.
  uint32 id = 1;
  oneof op {
    StoreGet store_get = 2;
    StorePut store_put = 3;
    StoreDelete store_delete = 4;
    StoreList store_list = 5;
    Lookup lookup = 6;
    RepeaterQuery repeater = 7;
    SendText send_text = 8;
    APRSSend aprs_send = 9;
    SendEmail send_email = 10;
    PlayPrompt play_prompt = 11;
  }
}

// ErrorCode is why a request failed.
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  // No such key, user or repeater.
  ERROR_CODE_NOT_FOUND = 1;
  // The request is malformed or out of its limits.
  ERROR_CODE_INVALID = 2;
  // The plugin may not do this, such as send from an ID that is not its
  // own, or from the APRS address of a user who did not turn its switch
  // on.
  ERROR_CODE_REFUSED = 3;
  // The plugin's store is full.
  ERROR_CODE_FULL = 4;
  // The hub cannot do it now, such as when its database fails. Try again
  // later.
  ERROR_CODE_UNAVAILABLE = 5;
  // The hub knows no text format that the radio sends, so it sends no
  // text to it. See SendText.
  ERROR_CODE_NO_FORMAT = 6;
  // The plugin sends requests faster than the hub takes them, or more
  // APRS messages than the hub sends for it. Try again later.
  ERROR_CODE_RATE = 7;
}

// Answer answers a Request.
message Answer {
  // The id of the Request.
  uint32 id = 1;
  // ERROR_CODE_UNSPECIFIED when the request worked.
  ErrorCode code = 2;
  // Why the request failed, for a log.
  string error = 3;
  oneof result {
    StoreValue store_value = 4;
    StoreEntries store_entries = 5;
    User user = 6;
    RepeaterInfo repeater = 7;
    TextSent text_sent = 8;
  }
}

// StoreGet asks for the value of a key in the plugin's store. Each plugin
// has its own store in the hub's database, which every replica of the hub
// shares and which lasts until the plugin is deleted.
message StoreGet {
  // 1 to 255 bytes.
  string key = 1;
}

// StorePut sets the value of a key in the plugin's store. A store holds at
// most 10000 keys.
message StorePut {
  // 1 to 255 bytes.
  string key = 1;
  // At most 16384 bytes.
  bytes value = 2;
  // When set, the hub drops the key this many seconds later.
  optional uint32 ttl_seconds = 3;
}

// StoreDelete drops a key from the plugin's store. The Answer has no error
// when the key was not there.
message StoreDelete {
  // 1 to 255 bytes.
  string key = 1;
}

// StoreList asks for the keys of the plugin's store that start with
// prefix, in byte order, with their values.
message StoreList {
  string prefix = 1;
  // Only the keys after this one, to go on from the last key of an earlier
  // answer.
  string after = 2;
  // At most this many keys, 1 to 100. 0 is 100.
  uint32 limit = 3;
}

// StoreValue is the value of a key.
message StoreValue {
  bytes value = 1;
  // When the hub drops the key, in milliseconds since 1970 UTC.
  optional int64 expires_at = 2;
}

// StoreEntries is the keys that a StoreList found.
message StoreEntries {
  repeated StoreEntry entries = 1;
  // More keys follow the last one.
  bool more = 2;
}

// StoreEntry is a key and its value.
message StoreEntry {
  string key = 1;
  bytes value = 2;
  optional int64 expires_at = 3;
}

// Lookup asks for the user who owns a radio ID, or who has a callsign.
// Only approved users who are not suspended are found.
message Lookup {
  oneof by {
    uint32 radio = 1;
    string callsign = 2;
  }
}

// User is a user of the hub.
message User {
  // The account ID, which is also the user's first radio ID.
  uint32 user_id = 1;
  string callsign = 2;
  // All the user's radio IDs: the account ID, then the IDs the user added.
  repeated uint32 radios = 3;
  // Each switch of the plugin, as the user set it.
  repeated UserSwitch switches = 4;
}

// UserSwitch is a switch of the plugin for one user.
message UserSwitch {
  uint32 user_id = 1;
  string callsign = 2;
  // The key of the Switch.
  string key = 3;
  bool on = 4;
  // The option that the user chose, or the preset, or empty for a switch
  // with no choice.
  string choice = 5;
}

// UserSwitches is each user who turned a switch of the plugin on.
message UserSwitches {
  repeated UserSwitch switches = 1;
}

// RepeaterQuery asks for the talkgroups of a repeater or hotspot, such as
// the one in the repeater field of a burst.
message RepeaterQuery {
  uint32 repeater = 1;
}

// RepeaterInfo is the talkgroups of a repeater or hotspot.
message RepeaterInfo {
  uint32 repeater = 1;
  string callsign = 2;
  // Timeslot 1, then timeslot 2.
  repeated SlotInfo slots = 3;
}

// SlotInfo is the talkgroups of a timeslot.
message SlotInfo {
  // 1 or 2.
  uint32 slot = 1;
  // The talkgroups that the owner linked for good.
  repeated uint32 static_talkgroups = 2;
  // The talkgroup that a radio linked last by keying up on it, when there
  // is one.
  optional uint32 dynamic_talkgroup = 3;
}

// SendText asks the hub to send a private text message to a radio. The
// plugin gives the text, not the bursts: the hub builds the message in the
// exact format of the last text that the radio itself sent through a
// repeater of its owner or one that an admin trusts (header type, rate,
// encoding and service), because a format that a radio does not send can
// lock it up, and sends it through the repeater and timeslot of that text.
// With no such text, the hub sends nothing and answers
// ERROR_CODE_NO_FORMAT. The hub answers once it sent the text, or, when
// the format asks the radio for an answer, once the radio acknowledged it:
// ERROR_CODE_REFUSED when the radio refused it, ERROR_CODE_UNAVAILABLE when
// it did not answer, and ERROR_CODE_INVALID for a text that the format
// cannot carry.
message SendText {
  // One of the plugin's IDs.
  uint32 source = 1;
  uint32 radio = 2;
  // The text, at most 500 characters.
  string body = 3;
  // The id of a Text from radio to source that this text answers. A hub
  // with FEATURE_PROMPT then builds the text in the exact format of that
  // Text, not of the last text of the radio, and sends it through the
  // repeater and timeslot of that Text. It answers ERROR_CODE_NO_FORMAT,
  // and sends nothing, when that Text came through a repeater of neither
  // the radio's owner nor one that an admin trusts, or in a format that
  // the hub cannot build again exactly, such as a UDT.
  optional uint64 reply_to = 4;
}

// PlayPrompt asks the hub to play spoken prompts, one after another, to a
// radio as a private voice call from one of the plugin's IDs. The hub
// plays them as it plays its own prompts: in the voice that the radio's
// owner picked, or the hub's voice, in the codec of the timeslot,
// through the repeater or hotspot of the hub where it sends the private
// calls to the radio, once the timeslot carried nothing from the radio
// for about a second. It plays one call per voice stream of the radio,
// and only through a repeater, hotspot or browser radio of the hub, never
// an OpenBridge peer. The hub answers once it queued the call:
// ERROR_CODE_NOT_FOUND when it does not know where the radio is, and
// ERROR_CODE_INVALID for an unknown clip.
message PlayPrompt {
  // One of the plugin's IDs.
  uint32 source = 1;
  uint32 radio = 2;
  // The timeslot, 1 or 2, such as that of the call this answers.
  uint32 slot = 3;
  // The names of the clips, 1 to 64, such as "word-timeslot" and
  // "digit-2". The hub's Setup page lists the clips.
  repeated string clips = 4;
  // The stream ID of the call of the radio that this answers, when there
  // is one. The hub plays at most one prompt for each stream.
  uint32 stream_id = 5;
}

// TextSent answers a SendText that the hub sent.
message TextSent {
  // The name of the format, such as "TMS" or "AnyTone".
  string format = 1;
}

// Text is a text message to one of the plugin's IDs, as the hub read it.
message Text {
  // The hub's number of the message. A stream gets a Text once per number;
  // while the plugin moves to another replica, both streams can send it.
  uint64 id = 1;
  uint32 source = 2;
  uint32 destination = 3;
  // A message to a talkgroup among the plugin's IDs.
  bool group = 4;
  // The timeslot, 1 or 2.
  uint32 slot = 5;
  // The repeater or hotspot the message came from.
  uint32 repeater = 6;
  // The name of the format, such as "TMS", "ETSI IP", "Hytera" or "AnyTone".
  string format = 7;
  string body = 8;
  // When the hub got the message, in milliseconds since 1970 UTC.
  int64 at = 9;
}

// SendEmail asks the hub to send an email to a user who turned a switch of
// the plugin on, such as a notice that a message waits for the user. The
// hub finds the user's email address, which the plugin never sees, and
// sends the email only when it has SMTP set up and the user confirmed the
// address. It ends the body with a line that names the plugin and the
// switch. It answers ERROR_CODE_NOT_FOUND for a user that Lookup does not
// find, ERROR_CODE_REFUSED when the switch is off or the user has no
// confirmed email address, ERROR_CODE_UNAVAILABLE when the hub has no
// SMTP or the email server fails, and ERROR_CODE_RATE after 30 emails of
// the plugin in a minute.
message SendEmail {
  uint32 user_id = 1;
  // The key of a switch of the plugin that the user turned on.
  string switch = 2;
  // 1 to 120 characters, with no line break.
  string subject = 3;
  // 1 to 4000 characters.
  string body = 4;
}

// APRSSend asks the hub to send an APRS message on its APRS-IS login. The
// hub answers once it handed the message to the replica that holds the
// login; APRS-IS does not say whether the addressee got it. A hub with
// FEATURE_APRS_INBOX gives the ack as an APRSMessage. A hub with no APRS-IS
// login answers ERROR_CODE_UNAVAILABLE.
message APRSSend {
  // The sender as CALLSIGN-SSID or CALLSIGN. The callsign is that of a
  // user who turned a switch of the plugin on.
  string source = 1;
  // At most 9 characters.
  string addressee = 2;
  // At most 67 characters, with none of "|", "~" or "{".
  string text = 3;
  // The message number, 1 to 5 letters or digits, or empty for a message
  // that wants no ack, such as an ack.
  string number = 4;
}

// APRSMessage is an APRS message from APRS-IS.
message APRSMessage {
  string source = 1;
  string addressee = 2;
  string text = 3;
  // Empty when the sender wants no ack.
  string number = 4;
}

// Draining tells a plugin that the replica of the hub that holds its stream
// stops soon. The plugin connects again while it keeps this stream: another
// replica takes the plugin over, and the hub ends this stream once the new
// one is up. Until then, the same burst can come on both streams.
message Draining {}

// Tracked is all the radios whose owners turned position tracking on.
message Tracked {
  repeated Tracking radios = 1;
}

// Tracking is the position tracking of one radio.
message Tracking {
  uint32 radio = 1;
  // Whether its owner wants its positions.
  bool on = 2;
  // How often the owner wants a position, in seconds.
  uint32 interval_seconds = 3;
}

// Heard tells that a radio with tracking on, or any radio after a
// Subscribe with heard, was heard on a repeater, where the hub now sends
// the private calls to it.
message Heard {
  uint32 radio = 1;
  // The timeslot it was heard on, 1 or 2.
  uint32 slot = 2;
  // The color code of the repeater, 0 to 15.
  uint32 color_code = 3;
  // When the hub heard the radio, in milliseconds since 1970 UTC, by the
  // clock of the hub. A Heard can come some time after that. A hub older
  // than this field leaves it out: take the time the Heard came then.
  optional int64 at = 4;
}

// Welcome tells a plugin who it is to the hub.
message Welcome {
  string name = 1;
  repeated IDRange ranges = 2;
  // What this replica of the hub serves besides bursts, tracking, positions
  // and the network. During an upgrade, replicas of two versions can serve
  // the same plugin one after the other.
  repeated Feature features = 3;
}

// Ranges is the plugin's IDs after an admin changed them.
message Ranges {
  repeated IDRange ranges = 1;
}

// IDRange is the DMR IDs from first to last, both included.
message IDRange {
  uint32 first = 1;
  uint32 last = 2;
}

// FrameType is the kind of a DMR burst.
enum FrameType {
  FRAME_TYPE_UNSPECIFIED = 0;
  FRAME_TYPE_VOICE = 1;
  FRAME_TYPE_VOICE_SYNC = 2;
  FRAME_TYPE_DATA_SYNC = 3;
}

// Burst is one DMR burst of a call, as the MMDVM network protocol carries it.
message Burst {
  // The source and destination DMR IDs.
  uint32 source = 1;
  uint32 destination = 2;
  // A group call to a talkgroup, else a private call to a radio.
  bool group_call = 3;
  // The timeslot, 1 or 2.
  uint32 slot = 4;
  // The stream ID, the same for every burst of a call.
  uint32 stream_id = 5;
  FrameType frame_type = 6;
  // The data type of a data sync burst, or the voice sequence (0 to 5) of a
  // voice burst.
  uint32 data_type_or_voice_sequence = 7;
  // The sequence number of the burst in its call, 0 to 255.
  uint32 sequence = 8;
  // The 33 bytes of the burst.
  bytes payload = 9;
  // The repeater or hotspot the call came from. The hub ignores it on bursts
  // that a plugin sends.
  uint32 repeater = 10;
}

// Refusal says why the hub did not send a burst of the plugin.
message Refusal {
  uint32 stream_id = 1;
  RefusalReason reason = 2;
}

// RefusalReason is why the hub did not send a burst.
enum RefusalReason {
  REFUSAL_REASON_UNSPECIFIED = 0;
  // The source is not one of the plugin's IDs.
  REFUSAL_REASON_SOURCE = 1;
  // A group call to a talkgroup that is not one of the plugin's IDs, or a
  // call to another plugin's IDs.
  REFUSAL_REASON_DESTINATION = 2;
  // The burst is malformed: a slot that is not 1 or 2, a payload that is
  // not 33 bytes, or no frame type.
  REFUSAL_REASON_MALFORMED = 3;
  // The plugin sent faster than a timeslot carries.
  REFUSAL_REASON_RATE = 4;
}
