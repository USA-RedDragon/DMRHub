name: Docs

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - doc/**
      - hack/docs-site/**
      - go.mod
      - go.sum
      - .github/workflows/docs.yaml

concurrency:
  group: '${{ github.workflow }} @ ${{ github.ref }}'
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Test the docs server
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Test the docs server
        run: go test ./hack/docs-site/server/

  docker:
    name: Docs image
    needs: test
    permissions:
      contents: read
      packages: write
      security-events: write
    uses: USA-RedDragon/reusable-actions/.github/workflows/docker-ci.yaml@c5ee15922a0ff4229b0f06a8d0551541b5cabfdc # v2.0.34
    with:
      push: ${{ github.event_name != 'pull_request' }}
      image-name: usa-reddragon/dmrhub-docs
      dockerfile: hack/docs-site/Dockerfile
      context: .
      version: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      trivy: 'false'
