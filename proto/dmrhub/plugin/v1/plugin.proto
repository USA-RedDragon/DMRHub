syntax = "proto3";

package dmrhub.plugin.v1;

option go_package = "github.com/USA-RedDragon/DMRHub/sdk/plugin/v1;pluginv1";

// PluginService is how a plugin talks to the hub. A plugin answers the calls
// to the IDs an admin gave it, and sends calls only from those IDs.
service PluginService {
  // Connect opens the plugin's one stream. The plugin sends its token in the
  // "authorization" metadata as "Bearer <token>". The hub answers first with
  // a Welcome, then sends the bursts of the calls to the plugin's IDs. A newer
  // connection of the same plugin ends this one.
  rpc Connect(stream ConnectRequest) returns (stream ConnectResponse);
}

// ConnectRequest is what a plugin sends.
message ConnectRequest {
  oneof message {
    // A burst of a call that the plugin sends.
    Burst burst = 1;
    // What the plugin wants to hear about besides the calls to its IDs.
    Subscribe subscribe = 2;
    // A position that a radio reported to the plugin.
    Position position = 3;
    // Who the plugin is. A plugin that runs inside DMRHub sends it first,
    // before the hub sends the Welcome. A plugin that runs as its own
    // program may send it after the Welcome, so that the Plugins page shows
    // its version.
    Hello hello = 4;
    // A request on a network connection of a plugin that runs inside
    // DMRHub. The hub ignores it from a plugin that runs as its own
    // program, which reaches the network by itself.
    NetRequest net = 5;
  }
}

// Hello tells the hub who a plugin is, and what it asks for.
message Hello {
  // The name the Plugins page shows, at most 64 characters.
  string name = 1;
  // The version of the plugin, at most 32 characters.
  string version = 2;
  // Who wrote the plugin, at most 64 characters.
  string author = 3;
  // What the plugin does, in a sentence or two, at most 500 characters.
  string description = 4;
  // The IDs the plugin asks for. The admin gives it its IDs, starting from
  // these.
  repeated IDRange ids = 5;
  // The hosts a plugin that runs inside DMRHub asks to reach. It reaches
  // only those that an admin allows.
  repeated Host hosts = 6;
}

// Host is a host that a plugin asks to reach, and why.
message Host {
  // The host name or IP address and the TCP port, such as
  // "nets.example.org:443".
  string address = 1;
  // Why the plugin reaches it, in a sentence, at most 200 characters.
  string reason = 2;
}

// NetRequest is a request of a plugin that runs inside DMRHub on one of its
// TCP connections. The hub answers each with a NetResponse of the same
// connection and operation. A connection has at most one read and one
// write at a time.
message NetRequest {
  // The plugin's number of the connection. Open gives it to a new
  // connection.
  uint32 conn = 1;
  oneof op {
    // Open connects to a host that an admin allowed, as host:port.
    string open = 2;
    // Read asks for at most this many bytes, at most 16384.
    uint32 read = 3;
    // Write sends these bytes, at most 16384.
    bytes write = 4;
    // Close closes the connection.
    NetClose close = 5;
  }
}

// NetClose closes a connection.
message NetClose {}

// NetOp is the operation that a NetResponse answers.
enum NetOp {
  NET_OP_UNSPECIFIED = 0;
  NET_OP_OPEN = 1;
  NET_OP_READ = 2;
  NET_OP_WRITE = 3;
  NET_OP_CLOSE = 4;
}

// NetResponse answers a NetRequest.
message NetResponse {
  uint32 conn = 1;
  NetOp op = 2;
  // The bytes that a read got.
  bytes data = 3;
  // How many bytes a write sent.
  uint32 written = 4;
  // Why the operation failed, or empty when it worked.
  string error = 5;
  // The host closed its side: a read gets no more bytes.
  bool eof = 6;
}

// Subscribe asks the hub for more than the calls to the plugin's IDs. A
// later Subscribe replaces an earlier one.
message Subscribe {
  // Tracking asks for the radios whose owners turned position tracking on:
  // a Tracked with all of them, a Tracking at each change, and a Heard each
  // time one of them is heard on a repeater.
  bool tracking = 1;
}

// PositionFormat is how a radio reported a position.
enum PositionFormat {
  POSITION_FORMAT_UNSPECIFIED = 0;
  POSITION_FORMAT_LRRP = 1;
  POSITION_FORMAT_NMEA = 2;
  POSITION_FORMAT_HDAP = 3;
}

// Position is a position that a radio reported. The hub keeps it only when
// the radio's owner turned tracking on, and the radio sent it to one of the
// plugin's IDs.
message Position {
  // The radio that reported the position.
  uint32 radio = 1;
  // The plugin's ID that the radio sent the position to.
  uint32 service = 2;
  // The timeslot it came on, 1 or 2.
  uint32 slot = 3;
  PositionFormat format = 4;
  // Degrees, north and east positive.
  double latitude = 5;
  double longitude = 6;
  optional double accuracy_meters = 7;
  optional double speed_meters_per_second = 8;
  // Degrees clockwise from true north.
  optional double heading_degrees = 9;
  optional double altitude_meters = 10;
  // When the radio took the fix, in seconds since 1970 UTC.
  optional int64 fix_time = 11;
}

// ConnectResponse is what the hub sends.
message ConnectResponse {
  oneof message {
    // The first message: who the plugin is and its IDs.
    Welcome welcome = 1;
    // A burst of a call to one of the plugin's IDs.
    Burst burst = 2;
    // A burst of the plugin that the hub did not send, and why.
    Refusal refusal = 3;
    // The admin changed the plugin's IDs.
    Ranges ranges = 4;
    // All the radios with tracking on, after a Subscribe with tracking.
    Tracked tracked = 5;
    // An owner turned tracking of a radio on or off, or changed how often
    // it reports.
    Tracking tracking = 6;
    // A radio with tracking on was heard on a repeater.
    Heard heard = 7;
    // The hub stops soon.
    Draining draining = 8;
    // The answer to a NetRequest of a plugin that runs inside DMRHub.
    NetResponse net = 9;
  }
}

// Draining tells a plugin that the replica of the hub that holds its stream
// stops soon. The plugin connects again while it keeps this stream: another
// replica takes the plugin over, and the hub ends this stream once the new
// one is up. Until then, the same burst can come on both streams.
message Draining {}

// Tracked is all the radios whose owners turned position tracking on.
message Tracked {
  repeated Tracking radios = 1;
}

// Tracking is the position tracking of one radio.
message Tracking {
  uint32 radio = 1;
  // Whether its owner wants its positions.
  bool on = 2;
  // How often the owner wants a position, in seconds.
  uint32 interval_seconds = 3;
}

// Heard tells that a radio with tracking on was heard on a repeater, where
// the hub now sends the private calls to it.
message Heard {
  uint32 radio = 1;
  // The timeslot it was heard on, 1 or 2.
  uint32 slot = 2;
  // The color code of the repeater, 0 to 15.
  uint32 color_code = 3;
}

// Welcome tells a plugin who it is to the hub.
message Welcome {
  string name = 1;
  repeated IDRange ranges = 2;
}

// Ranges is the plugin's IDs after an admin changed them.
message Ranges {
  repeated IDRange ranges = 1;
}

// IDRange is the DMR IDs from first to last, both included.
message IDRange {
  uint32 first = 1;
  uint32 last = 2;
}

// FrameType is the kind of a DMR burst.
enum FrameType {
  FRAME_TYPE_UNSPECIFIED = 0;
  FRAME_TYPE_VOICE = 1;
  FRAME_TYPE_VOICE_SYNC = 2;
  FRAME_TYPE_DATA_SYNC = 3;
}

// Burst is one DMR burst of a call, as the MMDVM network protocol carries it.
message Burst {
  // The source and destination DMR IDs.
  uint32 source = 1;
  uint32 destination = 2;
  // A group call to a talkgroup, else a private call to a radio.
  bool group_call = 3;
  // The timeslot, 1 or 2.
  uint32 slot = 4;
  // The stream ID, the same for every burst of a call.
  uint32 stream_id = 5;
  FrameType frame_type = 6;
  // The data type of a data sync burst, or the voice sequence (0 to 5) of a
  // voice burst.
  uint32 data_type_or_voice_sequence = 7;
  // The sequence number of the burst in its call, 0 to 255.
  uint32 sequence = 8;
  // The 33 bytes of the burst.
  bytes payload = 9;
  // The repeater or hotspot the call came from. The hub ignores it on bursts
  // that a plugin sends.
  uint32 repeater = 10;
}

// Refusal says why the hub did not send a burst of the plugin.
message Refusal {
  uint32 stream_id = 1;
  RefusalReason reason = 2;
}

// RefusalReason is why the hub did not send a burst.
enum RefusalReason {
  REFUSAL_REASON_UNSPECIFIED = 0;
  // The source is not one of the plugin's IDs.
  REFUSAL_REASON_SOURCE = 1;
  // A group call to a talkgroup that is not one of the plugin's IDs, or a
  // call to another plugin's IDs.
  REFUSAL_REASON_DESTINATION = 2;
  // The burst is malformed: a slot that is not 1 or 2, a payload that is
  // not 33 bytes, or no frame type.
  REFUSAL_REASON_MALFORMED = 3;
  // The plugin sent faster than a timeslot carries.
  REFUSAL_REASON_RATE = 4;
}
