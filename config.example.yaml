# Sample configuration
# Logging level for the application. One of debug, info, warn, or error
log-level: "info"
# Redis configuration for the application
redis:
  # Enable Redis support
  enabled: false
  # Redis host address
  # host: ""
  # Redis port
  port: 6379
  # Redis password
  # password: ""
# Database configuration for the application
database:
  # Database driver to use. One of sqlite, postgres, or mysql
  driver: "sqlite"
  # Database name or path
  database: "DMRHub.db"
  # Database host address (postgres and mysql only)
  # host: ""
  # Database port (postgres and mysql only)
  # port: 0
  # Database username (postgres and mysql only)
  # username: ""
  # Database password (postgres and mysql only)
  # password: ""
  # Additional parameters for the database connection, e.g., sslmode=disable
  extra-parameters: ["_pragma=foreign_keys(1)", "_pragma=journal_mode(WAL)", "_pragma=synchronous(NORMAL)"]
# Secret key for the application, used for signing and encryption of the user session. Required; use a random value of at least 15 characters
# secret: ""
# Salt used for hashing user passwords. Required; use a random value of at least 15 characters, different from secret
# password-salt: ""
# HTTP server configuration for the application
http:
  # HTTP server listen address
  bind: "[::]"
  # HTTP server port
  port: 3005
  # Robots.txt configuration for the HTTP server
  robots-txt:
    # Mode for serving robots.txt. One of allow, disabled, or custom
    mode: "disabled"
    # Content of the robots.txt file when mode is custom
    # content: ""
  # CORS configuration for the HTTP server
  cors:
    # Enable CORS support for the HTTP server
    enabled: false
    # List of additional allowed CORS origins
    # extra-hosts: []
  # List of trusted proxy IPs for the HTTP server
  # trusted-proxies: []
  # URL the HTTP server is reached at, used for generating absolute URLs, e.g. https://dmrhub.example.com. Required
  # canonical-host: ""
# DMR server configuration for the application
dmr:
  # MMDVM server configuration for DMR
  mmdvm:
    # MMDVM server listen address
    bind: "[::]"
    # MMDVM server port
    port: 62031
    # WebTransport listener for browser hotspots and radios
    webtransport:
      # Accept browser hotspots and radios over WebTransport
      enabled: false
      # UDP port of the WebTransport listener
      port: 62032
      # TLS certificate file, such as the one that cert-manager mounts. Empty makes DMRHub use short-lived certificates of its own, which browsers accept through the hashes that DMRHub publishes
      # cert-file: ""
      # TLS key file of the certificate file
      # key-file: ""
      # Origins of the web pages that may open a session, such as https://radio.example. Empty allows every origin
      # allowed-origins: []
  # OpenBridge server configuration for DMR
  openbridge:
    # Enable OpenBridge server support
    enabled: false
    # OpenBridge server listen address
    bind: "[::]"
    # OpenBridge server port
    port: 62035
    # Server ID of 4 to 7 digits that DMRHub sends to enhanced (FreeDMR) OpenBridge peers as the source server. 0 sends the network ID of each peer
    # server-id: 0
  # IPSC server configuration for Motorola DMR repeaters
  ipsc:
    # Enable IPSC server support
    enabled: false
    # IPSC server listen address
    bind: "[::]"
    # IPSC server port
    port: 50000
    # DMR network ID that identifies this server to IPSC peers. Required when IPSC is enabled
    # network-id: 0
    # Wait for data and CSBK calls to IPSC after a voice call on a slot; 0 is off
    call-hang-hold: "2.5s"
    # Wait for data and CSBK calls to IPSC after a data call on a slot; 0 is off
    data-hang-hold: "1.2s"
  # MMDVM modem board on a serial port that DMRHub drives as a hotspot or repeater of its own, without MMDVMHost
  modem:
    # Drive an MMDVM modem board (MMDVM_HS hat, MMDVM repeater board, DVMega) on a serial port as a hotspot or repeater of this server
    enabled: false
    # Serial device of the modem, such as /dev/ttyAMA0 or /dev/ttyACM0. Required when the modem is enabled
    # port: ""
    # Speed of the serial port in baud: 9600, 19200, 38400, 57600, 115200, 230400, 460800 or 921600
    baud: 115200
    # ID of the repeater that the modem is on the network. DMRHub makes it a modem repeater when the modem connects, and refuses network logins with its ID. A repeater that does not exist is made with no owner, and an admin assigns its owner. Required when the modem is enabled
    # repeater-id: 0
    # Run the modem as a duplex repeater with two timeslots. Off runs it as a simplex hotspot, whose one channel is timeslot 2
    duplex: false
    # Color code of the modem, 0 to 15
    color-code: 1
    # Receive frequency in Hz. Required when the modem is enabled
    # rx-frequency: 0
    # Transmit frequency in Hz. Required when the modem is enabled
    # tx-frequency: 0
    # Correction in Hz added to the receive frequency, for the frequency error of the board
    rx-offset: 0
    # Correction in Hz added to the transmit frequency, for the frequency error of the board
    tx-offset: 0
    # Transmit power in percent, on boards that set it, such as MMDVM_HS hats
    rf-level: 100
    # Receive audio level in percent
    rx-level: 50
    # Transmit deviation level in percent
    tx-level: 50
    # Receive DC offset, -128 to 127
    rx-dc-offset: 0
    # Transmit DC offset, -128 to 127
    tx-dc-offset: 0
    # Invert the receive audio
    rx-invert: false
    # Invert the transmit audio, which most boards need
    tx-invert: true
    # Invert the PTT output
    ptt-invert: false
    # Time in milliseconds, 0 to 500, that the transmitter is on before the first burst
    tx-delay: 100
    # Delay of the duplex receiver in symbols, 0 to 255
    dmr-delay: 0
    # Ask the modem for its debug messages and log them
    debug: false
    # Path to an RSSI.dat file in the MMDVMHost format, which maps the raw RSSI of the board to dBm. Without it the RSSI of modem calls is not known
    # rssi-mapping-file: ""
    # Morse station ID that the modem sends while the channel is idle
    cw-id:
      # Send a morse station ID while the channel is idle
      enabled: false
      # Minutes between station IDs, 1 to 1440. The first goes out a quarter of this time after the modem connects or the channel goes idle
      time: 10
      # Callsign to send in morse: letters, digits, spaces and / ? , - = . Required when the station ID is on
      # callsign: ""
    # Roaming beacons of a duplex modem, as MMDVMHost sends them
    beacons:
      # Key up the transmitter of a duplex modem at each interval while the channel is idle
      enabled: false
      # Seconds between beacons, 1 to 86400
      interval: 60
      # Seconds that each beacon keys up, at least 1 and less than the interval
      duration: 3
  # Turn off all the RadioID checks of radio-id-checks, whatever they are set to
  disable-radio-id-validation: false
  # Checks of DMR IDs and callsigns against the RadioID data, each of which can be on or off
  radio-id-checks:
    # Refuse a registration whose DMR ID does not have 7 digits
    user-id: true
    # Refuse a registration or a callsign change whose callsign RadioID does not list under the DMR ID of the account, and list on the RadioID drift page the accounts whose callsign RadioID no longer lists
    callsign: true
    # Refuse an added radio ID that RadioID does not list under the callsign of the user, and list on the RadioID drift page the added radio IDs that RadioID no longer lists under it
    radio-ids: true
    # Refuse a 6-digit repeater ID that RadioID does not list under the callsign of its owner, and fill in the details of the repeater from RadioID
    repeater-ids: true
    # Refuse a 9-digit hotspot ID that does not start with the DMR ID of its owner
    hotspot-ids: true
  # URL to fetch radio ID information for validation and display purposes. Expected JSON format is the same as RadioID.net.
  radio-id-url: "https://www.radioid.net/static/users.json"
  # URL to fetch repeater information for validation and display purposes. Expected JSON format is the same as RadioID.net.
  repeater-id-url: "https://www.radioid.net/static/rptrs.json"
  # Host name or IP address that hotspots and repeaters connect to, as the enroll page shows it, such as dmr.example.org. Empty uses the host name of the canonical host of the HTTP server
  # public-address: ""
  # How long DMRHub keeps its records
  retention:
    # Days to keep text and data messages, with their raw bytes. 0 keeps them forever
    messages: 0
    # Days to keep the last heard entries of voice, data and control traffic. 0 keeps them forever
    transmissions: 0
    # Days to keep the raw DMR bursts of each transmission. 0 keeps them forever
    bursts: 0
  # Position tracking of the radios whose owners turn it on
  positions:
    # Shortest report interval, in minutes, that an owner can pick for a radio: 5, 10, 15, 30 or 60
    min-interval: 5
    # Longest time, in days, that an owner can keep the positions of a radio, from 1 to 365
    max-retention: 30
    # APRS-IS login of the hub, which sends the positions of the radios whose owners turn it on
    aprs-is:
      # Callsign with SSID that the hub logs in to APRS-IS as. Empty sends nothing to APRS-IS
      # callsign: ""
      # APRS-IS server, as host:port
      server: "rotate.aprs2.net:14580"
  # Plugins, which answer the calls to the IDs an admin gives them: inside DMRHub, or as their own programs that connect to its listener
  plugins:
    # Run the parrot, the location server and the uploaded plugins inside DMRHub. Turn it off only when every plugin runs as its own program
    in-process: true
    # Accept plugins that run as their own programs
    enabled: false
    # Address the plugin listener binds to
    bind: "[::]"
    # TCP port that plugins connect to
    port: 3006
    # TLS certificate file of the plugin listener. Empty makes DMRHub use a certificate of its own, which plugins check by its fingerprint
    # cert-file: ""
    # TLS key file of the certificate file
    # key-file: ""
  # Conversion of calls between Codec2 and AMBE
  transcoding:
    # AMBE servers (AMBEserver protocol, usually UDP port 2460) that convert calls between Codec2 and AMBE, in the order a call tries them. Each converted call holds one server for its whole length. None turns transcoding off, and calls pass through in their own codec. Each server must accept the setting that makes it report the decoder status of each frame (PKT_SPCHFMT); a server that refuses it converts no call
    # ambe-servers:
    #   - address: ""
    #     calls: 0
  # How DMRHub finds the radio that a private call, SMS or data message goes to
  private-calls:
    # Routing of private voice calls
    voice:
      # Radios that private traffic reaches. One of hybrid (any radio heard on a repeater of this network; a radio ID that a user owns counts only where that user owns the repeater or an admin trusts it), members (only the radio IDs that users own, on the repeaters of their owner or trusted ones), or anyone (any radio, wherever it was last heard)
      reach: "hybrid"
      # What happens to private traffic to a radio that the reach allows but that DMRHub has not heard, or not within the max age. One of drop (drop it and log it) or flood (send it to every repeater)
      unknown: "drop"
      # Longest time since a radio was last heard on a repeater that private traffic still goes there, such as 24h. 0 is no limit
      max-age: "0s"
    # Routing of private SMS, data and CSBK, such as radio checks and call alerts. A setting that is left empty takes the value of the voice setting
    data:
      # Radios that private SMS and data reach, as for voice. Empty takes the voice reach
      # reach: ""
      # What happens to private SMS and data to a radio that DMRHub has not heard, as for voice. Empty takes the voice setting
      # unknown: ""
      # Longest time since a radio was last heard that private SMS and data still go there. 0 takes the voice max age; a negative value, such as -1s, is no limit
      max-age: "0s"
  # Source addresses that DMRHub refuses or alone accepts, before any other work on a packet
  ip-lists:
    # Addresses of MMDVM hotspots and repeaters
    mmdvm:
      # Which list applies. One of off (accept every address), block (refuse the addresses of the block list) or allow (refuse every address but those of the allow list)
      mode: "off"
      # Addresses and CIDR ranges, IPv4 or IPv6, such as 203.0.113.7 or 2001:db8::/32, that the block mode refuses
      # block: []
      # Addresses and CIDR ranges, IPv4 or IPv6, that the allow mode accepts
      # allow: []
    # Addresses of browser radios over WebTransport
    webtransport:
      # Which list applies. One of off (accept every address), block (refuse the addresses of the block list) or allow (refuse every address but those of the allow list)
      mode: "off"
      # Addresses and CIDR ranges, IPv4 or IPv6, such as 203.0.113.7 or 2001:db8::/32, that the block mode refuses
      # block: []
      # Addresses and CIDR ranges, IPv4 or IPv6, that the allow mode accepts
      # allow: []
    # Addresses of Motorola IPSC repeaters
    ipsc:
      # Which list applies. One of off (accept every address), block (refuse the addresses of the block list) or allow (refuse every address but those of the allow list)
      mode: "off"
      # Addresses and CIDR ranges, IPv4 or IPv6, such as 203.0.113.7 or 2001:db8::/32, that the block mode refuses
      # block: []
      # Addresses and CIDR ranges, IPv4 or IPv6, that the allow mode accepts
      # allow: []
    # Addresses of OpenBridge peers
    openbridge:
      # Which list applies. One of off (accept every address), block (refuse the addresses of the block list) or allow (refuse every address but those of the allow list)
      mode: "off"
      # Addresses and CIDR ranges, IPv4 or IPv6, such as 203.0.113.7 or 2001:db8::/32, that the block mode refuses
      # block: []
      # Addresses and CIDR ranges, IPv4 or IPv6, that the allow mode accepts
      # allow: []
  # How DMRHub links talkgroups and which transmissions it takes
  routing:
    # Do not link a talkgroup as the dynamic talkgroup of a timeslot when someone transmits on it or a hotspot dials it. Calls still reach the repeaters that carry the talkgroup
    disable-dynamic-links: false
    # Time with no transmission from a repeater on its dynamic talkgroup after which DMRHub unlinks it from that timeslot, such as 15m. 0 never unlinks it
    dynamic-timeout: "15m"
    # Make a talkgroup when a repeater or hotspot of this network sends a group voice call to an ID that is not a talkgroup, rather than drop the call
    auto-create-talkgroups: false
    # Delete a talkgroup that DMRHub made by itself when no call is made on it for the ephemeral TTL. A talkgroup that an admin edits is kept
    ephemeral-talkgroups: false
    # Time with no call on a talkgroup that DMRHub made by itself after which it deletes the talkgroup, when ephemeral talkgroups are on, such as 24h
    ephemeral-ttl: "24h"
    # Radios that may transmit through the repeaters and hotspots of this network. One of any (any radio ID), radioid (the radio IDs that the RadioID list has) or members (the DMR IDs of accounts and the radio IDs that their users added)
    transmit: "any"
    # Longest voice transmission that DMRHub routes, such as 3m. DMRHub drops the rest of a longer one. 0 is no limit
    max-transmission: "0s"
    # What a repeater gets when two group calls reach the same timeslot of it at once, such as two radios on one talkgroup. One of mix (both calls, their bursts interleaved) or first (the first call holds the timeslot until it ends, and DMRHub drops the other call there)
    contention: "mix"
  # Most repeaters and hotspots that a user can add. Admins have no limit. 0 is no limit
  repeater-quota: 100
  # Longest time, in seconds, that a replica that stops keeps serving its repeaters, peers, browser radios and plugins while other replicas take them over. It must be shorter than the time the orchestrator gives the replica to stop. 0 stops at once
  drain-timeout: 25
# SMTP configuration for sending emails
smtp:
  # Enable SMTP support for sending emails
  enabled: false
  # SMTP server host address
  # host: ""
  # SMTP server port
  port: 25
  # SMTP TLS mode. One of none, starttls, or implicit
  tls: "none"
  # SMTP server username
  # username: ""
  # SMTP server password
  # password: ""
  # Email address to use as the sender
  # from: ""
  # SMTP authentication method. One of none, plain, or login
  auth-method: "none"
# Name of the DMR network, shown in the web interface
network-name: "DMRHub"
# Metrics configuration for the application
metrics:
  # Enable metrics collection and export
  enabled: false
  # Metrics server listen address
  bind: "[::]"
  # Metrics server port
  port: 9000
  # List of trusted proxy IPs for the metrics server
  # trusted-proxies: []
  # OTLP endpoint for exporting OpenTelemetry tracing data
  # otlp-endpoint: ""
# PProf configuration for the application, used for profiling and debugging purposes
pprof:
  # Enable PProf profiling and debugging support
  enabled: false
  # PProf server listen address
  bind: "[::]"
  # List of trusted proxy IPs for the PProf server
  # trusted-proxies: []
  # PProf server port
  port: 6060
# API key for the Have I Been Pwned service, used for checking if passwords have been compromised
# hibp-api-key: ""
# Approve new users when they register, so they can log in at once without waiting for an admin
auto-approve-users: false
