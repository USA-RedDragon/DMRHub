name: Screenshots

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: '${{ github.workflow }} @ ${{ github.ref }}'
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    name: Docs use only the shots of the harness
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - run: go run ./hack/screenshots -phase check

  screenshots:
    name: Make the screenshots
    if: startsWith(github.ref, 'refs/tags/')
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Set up TinyGo
        run: ./hack/install-tinygo.sh

      - name: Install pasta and oxipng
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends passt oxipng
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build MMDVMHost and DMRGateway
        run: ./hack/external/setup.sh mmdvmhost dmrgateway

      - name: Make the screenshots
        run: CHROMIUM="$(command -v google-chrome)" make screenshots

      - name: Show the changed screenshots
        run: git status --short doc/Screenshots

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: doc/Screenshots
