name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: '${{ github.workflow }} @ ${{ github.ref }}'
  cancel-in-progress: false

jobs:
  release:
    name: Release
    permissions:
      contents: write
      packages: write
    uses: USA-RedDragon/reusable-actions/.github/workflows/goreleaser.yaml@ff5d8c9d1d9fda2d1ca4cb4325987a429db9a85a # v2.0.39
    with:
      setup-node: true
      run-before: ./hack/install-tinygo.sh
      docker-hub-username: jamcswain
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
      docker-hub-password: ${{ secrets.DOCKER_PASSWORD }}
