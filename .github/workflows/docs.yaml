name: Docs

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths:
      - doc/**
      - hack/docs-site/**
      - hack/carry/**
      - go.mod
      - go.sum
      - .github/workflows/docs.yaml

concurrency:
  group: '${{ github.workflow }} @ ${{ github.ref }}'
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Test the docs server
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Test the docs server
        run: go test ./hack/docs-site/server/ ./hack/carry/

  docker:
    name: Docs image
    needs: test
    permissions:
      contents: read
      packages: write
      security-events: write
    uses: USA-RedDragon/reusable-actions/.github/workflows/docker-ci.yaml@ff5d8c9d1d9fda2d1ca4cb4325987a429db9a85a # v2.0.39
    with:
      push: ${{ github.event_name != 'pull_request' }}
      image-name: usa-reddragon/dmrhub-docs
      dockerfile: hack/docs-site/Dockerfile
      context: .
      version: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      build-args: SOURCES_RUN=${{ github.run_id }}-${{ github.run_attempt }}
