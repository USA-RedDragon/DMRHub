log-level: "debug"
redis:
  enabled: false
database:
  driver: "sqlite"
  database: "DMRHub.db"
  extra-parameters: ["_pragma=foreign_keys(1)", "_pragma=journal_mode(WAL)"]
secret: "smoke-secret-0123456789"
password-salt: "smoke-salt-9876543210"
http:
  bind: "127.0.0.1"
  port: 3005
  canonical-host: "http://127.0.0.1:3005"
dmr:
  mmdvm:
    bind: "127.0.0.1"
    port: 62031
  openbridge:
    enabled: true
    bind: "127.0.0.1"
    port: 62035
  disable-radio-id-validation: true
  radio-id-url: "http://127.0.0.1:1/users.json"
  repeater-id-url: "http://127.0.0.1:1/rptrs.json"
network-name: "DMRHub smoke"
